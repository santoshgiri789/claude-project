spring.application.name=url-shortener

# In-memory H2 database
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON: snake_case to match the OpenAPI contract in specs/url-shortener.yaml
# (short_code, short_url, click_count, last_accessed_at, expires_at, ...).
spring.jackson.property-naming-strategy=SNAKE_CASE

# Base URL used when building the returned short_url.
app.base-url=http://localhost:8080